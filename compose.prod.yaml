# Production override. Applied on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up
#
# No server exists — this profile is how production readiness is verified locally
# (see .claude/docs/deployment.md). Development-only services carry the `dev`
# profile and are simply never enabled here.
#
# `!reset` removes an entry the base file set. Without it Compose merges volume
# lists, and the bind mounts would shadow the code baked into the images — which
# would make this profile a development stack wearing a production label.

x-prod-php: &prod-php
  # Named explicitly so the image assertions in CI have a stable target to inspect.
  image: postbox-backend:prod
  build:
    target: prod
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    # The default channel (config/logging.php) writes to a file inside the
    # container, which `docker compose logs` never shows and a container
    # recreation discards. Every PHP-based service under this anchor —
    # backend, every worker and the scheduler — logs one JSON object per
    # line to stderr instead, which is what Step 17's correlation ids
    # (request_id; delivery_id/endpoint_id/message_id) are for.
    LOG_CHANNEL: stderr
    LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  restart: unless-stopped

services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  # `volumes: !reset []` is repeated on every PHP service rather than living once in
  # `x-prod-php` above: Compose 2.38.2 (the GitHub Actions runner's version) does not
  # apply a `!reset` tag merged in through a YAML anchor/alias — only 5.1+ (this
  # project's local Compose) does. An anchor'ed `!reset` silently no-ops on the
  # runner, and every PHP service keeps its development bind mounts (`./backend`,
  # the vendor/storage volumes, `./contract`) shadowing the code baked into the
  # image — a production profile wearing a development stack underneath. Found by
  # assert-stateless-workers.sh failing only in CI; reproduced locally by rendering
  # this file with both Compose versions side by side.
  migrate:
    <<: *prod-php
    volumes: !reset []
    restart: "no"

  backend:
    <<: *prod-php
    volumes: !reset []

  worker-deliveries:
    <<: *prod-php
    volumes: !reset []

  worker-retries:
    <<: *prod-php
    volumes: !reset []

  worker-maintenance:
    <<: *prod-php
    volumes: !reset []

  scheduler:
    <<: *prod-php
    volumes: !reset []

  frontend:
    image: postbox-frontend:prod
    build:
      target: prod
    env_file: !reset []
    volumes: !reset []
    environment:
      NODE_ENV: production
      # Server-only (never NEXT_PUBLIC_): every Server Component, Server
      # Action and Route Handler in this app reaches the backend through
      # nginx, the same single origin the browser itself uses (D110) — this
      # value is never bundled into client JavaScript.
      POSTBOX_SERVER_API_URL: http://nginx:8080/api
    restart: unless-stopped

  nginx:
    image: postbox-nginx:prod
    restart: unless-stopped
