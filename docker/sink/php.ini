; The sink is the yardstick every published PostBox figure is reported against,
; so it runs with the settings a receiver would actually be tuned with. A sink
; left on development defaults would understate its own ceiling and, through
; the 80% sink-bound rule in benchmarking.md, silently cap what PostBox is
; allowed to claim.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0

memory_limit=256M

; No stack traces, no verbose errors: a failing request under load should cost
; the sink a status code, not a rendered exception page.
display_errors=Off
expose_php=Off
