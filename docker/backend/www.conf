; Explicit FPM pool sizing (Step 15 Phase C). Copied to
; /usr/local/etc/php-fpm.d/zz-postbox-pool.conf — a name that sorts
; alphabetically after the base image's own zz-docker.conf, so these pm.*
; directives for the [www] pool are the last ones php-fpm reads and win.
; user/group stay in the base image's own www.conf, commented out by the
; existing sed in the Dockerfile; this file touches pool sizing only.
;
; The stock pm.max_children = 5 was this project's own published, measured
; ingest ceiling since Step 10 (benchmarking.md's own "report both, name
; both, tune neither" record, until now). Raising it is what the live
; stream (Step 15) needs: one SSE connection pins one FPM child for its
; whole life, and postbox.stream.max_concurrent_per_tenant has to stay well
; under this pool's own size — with headroom left for ingest, the dashboard
; API and the health check — or a single tenant's own open dashboard tabs
; could starve the rest of the application.
;
; 16 total, postbox.stream.max_concurrent_per_tenant = 4: twelve children
; stay free for everything else. Sized against this host's own ~7.5 GiB
; Docker allocation, shared with the maintainer's other projects (D73) —
; these two numbers are not independent, so reconsider both together if
; either one changes.
[www]
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
