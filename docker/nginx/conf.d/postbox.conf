upstream backend {
    server backend:9000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 8080;
    server_name _;

    # The ingest payload cap is enforced by the application in Step 4; this is the
    # outer bound that stops an oversized body from reaching PHP at all.
    client_max_body_size 1m;

    charset utf-8;

    # nginx's own liveness. It says nothing about the application — that is what
    # /api/health is for — so it never depends on an upstream.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Both API surfaces are served by PHP-FPM through the single Laravel front
    # controller. /api is the dashboard and health surface, /v1 the public API.
    location ~ ^/(api|v1)(/|$) {
        include fastcgi_params;

        fastcgi_pass   backend;
        fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        fastcgi_param  DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout    60s;
        fastcgi_send_timeout    60s;

        fastcgi_hide_header X-Powered-By;
    }

    # Everything else is the Next.js application. The upgrade headers are what
    # keeps hot reload working in development; in production they are inert.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
