upstream backend {
    server backend:9000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 8080;
    server_name _;

    # The ingest payload cap is enforced by the application in Step 4; this is the
    # outer bound that stops an oversized body from reaching PHP at all.
    client_max_body_size 1m;

    charset utf-8;

    # nginx's own liveness. It says nothing about the application — that is what
    # /api/health is for — so it never depends on an upstream.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The live SSE stream (Step 15). An exact-match location wins over the
    # regex location below regardless of the order either is declared in,
    # so the stream alone gets buffering disabled and a longer read timeout
    # — nothing else on /api or /v1 changes (D131).
    location = /api/v1/stream {
        include /etc/nginx/snippets/fastcgi-backend.conf;

        fastcgi_buffering    off;      # the whole point: deployment.md has claimed this since Step 1
        fastcgi_read_timeout 120s;     # comfortably past max_lifetime_seconds (30s default) plus heartbeats
        fastcgi_send_timeout 120s;

        gzip off;                     # explicit: the http block sets no gzip today, but compression would buffer the stream
    }

    # Both API surfaces are served by PHP-FPM through the single Laravel front
    # controller. /api is the dashboard and health surface, /v1 the public API.
    location ~ ^/(api|v1)(/|$) {
        include /etc/nginx/snippets/fastcgi-backend.conf;

        fastcgi_read_timeout    60s;
        fastcgi_send_timeout    60s;
    }

    # Everything else is the Next.js application. The upgrade headers are what
    # keeps hot reload working in development; in production they are inert.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # $http_host, not $host: nginx strips the port from $host, and Next
        # rejects a Server Action whose Origin header does not match the host it
        # was served under. Dropping :8080 turns every mutation in the dashboard
        # into "Invalid Server Actions request".
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
