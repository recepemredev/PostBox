# Shared FastCGI parameters for the PHP-FPM backend, extracted at the
# second occurrence (D131): both the regular API location and the live
# stream's own exact-match location include this, then each declares its
# own timeouts and buffering after the include.

include fastcgi_params;

fastcgi_pass   backend;
fastcgi_param  SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param  SCRIPT_NAME     /index.php;
fastcgi_param  DOCUMENT_ROOT   /var/www/html/public;

fastcgi_connect_timeout 5s;
fastcgi_hide_header X-Powered-By;
