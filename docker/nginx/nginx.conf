worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # One line per request, on stdout, so `docker compose logs` is the only place
    # a request log ever needs to be read from.
    log_format postbox '$remote_addr $request_method $request_uri $status '
                       '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    access_log /dev/stdout postbox;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    # Temporary paths under /tmp: the image runs as a non-root user and cannot
    # write to the default locations under /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
